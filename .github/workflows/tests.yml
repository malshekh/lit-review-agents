# Offline test suite. Every provider key is blank and the variables that redirect provider SDKs are unset, so a
# test that reaches a provider fails instead of spending. tests/conftest.py additionally refuses any socket.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: windows-latest          # the platform the pipeline runs on (paths, file locking, console encoding)
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      MOONSHOT_API_KEY: ""
      GEMINI_API_KEY: ""
      LANGSMITH_API_KEY: ""
      LANGSMITH_TRACING: "false"
      ANTHROPIC_BASE_URL: ""
      ANTHROPIC_AUTH_TOKEN: ""
      OPENAI_BASE_URL: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refuse to run with a provider key present
        shell: bash
        run: |
          for v in ANTHROPIC_API_KEY OPENAI_API_KEY MOONSHOT_API_KEY GEMINI_API_KEY LANGSMITH_API_KEY; do
            if [ -n "${!v}" ]; then echo "$v is set in CI; tests must run without keys"; exit 1; fi
          done
      - run: python -B -m pytest -q -p no:cacheprovider
