# Pipeline configuration: which model runs each agent, budgets, loop limits, notifications.
# Change models here, never in code.
#
# Design rule: an auditor never runs on the same vendor as the agent whose work it checks.
#   Claude (Anthropic) produces:  screening (Haiku), extraction and editing (Sonnet), synthesis and writing (Opus 5)
#   OpenAI GPT-6.1 plans and audits: scope, search, outline; A06-SV checks A05 extraction, A10-RV checks A09/A12 prose
#   Kimi (Moonshot) critiques:    A11-RC — a third vendor for an independent reader's view
# Qualified on a drug-repurposing oncology topic (run 20261025-100039): Opus 5.5 refused twice ("bio"
# classifier), so A07/A09 use Opus 5. Refusals are recorded per model and topic family (see routing).

run:
  spend_cap_usd: 35.00          # hard stop for one run; the orchestrator halts before exceeding it
  warn_at_fraction: 0.8         # warning email/log when 80% of the cap is spent
  allow_unpriced_models: false  # refuse to run a model with no price in prices.yaml

loops:
  max_json_repair_attempts: 1   # re-ask once if an agent returns invalid JSON
  max_search_repairs: 2         # A03 REPAIR rounds per query family
  max_reextractions: 0          # A06 defect -> A05 re-extraction rounds per paper
  max_critique_cycles: 2        # A11 critique -> A12 revision cycles
  cq_batch_size: 20             # records per A04 call
  max_redrafts: 1               # A10 blocking findings on the first draft -> A09 redraft
  verification: draft_and_final # legacy preference; version-bound A10 rechecks changed text via its cache

retrieval:
  max_records_total: 300        # across all query families and sources (A03-LM budget)
  max_records_per_family: 300
  citation_expansion:
    enabled: true
    depth: 1                    # 1 or 2. Use 2 only for sparse topics (A03-LM §4.5): it seeds from
                                #   depth-1 records A04-CQ qualified, and costs extra A04 screening
    max_per_seed: 30            # newest-first cap on citing + cited papers per seed
    max_per_seed_depth2: 15     # tighter cap per seed at depth 2
    max_total: 100              # cap on new records from expansion
    directions: [references, citations]   # backward and forward

# Where each provider is reached. API keys are read from .env (never stored here).
providers:
  anthropic:
    key_env: ANTHROPIC_API_KEY
    send_temperature: false     # Opus 5.5 / Sonnet 5.5 removed sampling params; anthropic SDK 1.x dropped the argument
  openai:
    key_env: OPENAI_API_KEY
    base_url: null              # default OpenAI endpoint
    send_temperature: false     # GPT-5/GPT-6 reasoning models reject non-default temperature
    json_mode: true
  kimi:
    key_env: MOONSHOT_API_KEY
    base_url: https://api.moonshot.ai/v1   # international platform (keys from platform.kimi.ai)
    send_temperature: false
    json_mode: true

models:
  # Claude:  https://platform.claude.com/docs/en/about-claude/pricing
  claude_strong:  claude-opus-5-5     # $4 / $20 per M tokens
  claude_default: claude-sonnet-5-5   # $2 / $10
  claude_fast:    claude-haiku-5-5    # $0.10 / $0.50 (prompts <=100k tokens)
  claude_opus5:   claude-opus-5       # $5 / $25 — used where Opus 5.5 refuses the topic
  # OpenAI:  https://developers.openai.com/api/docs/pricing
  openai_strong:  gpt-6.1-sol         # $2 / $10   — auditors
  openai_fast:    gpt-5-mini          # $0.25 / $2. Snapshot shuts down Dec 11, 2026
  openai_luna:    gpt-6-luna          # $0.10 / $0.50 — A04 alternate if Haiku refuses a topic
  # Kimi:    https://platform.kimi.ai (international, USD)
  kimi_strong:    kimi-k3             # $3 / $15
  kimi_pro:       kimi-k3.1-pro       # $2 / $10
  kimi_default:   kimi-k2.6           # $0.95 / $4

agents:
  # Claude agents: thinking is always on and counts toward max_tokens (requests are streamed, so
  # large caps are safe; you pay only for tokens used). `effort` sets how much thinking is spent.
  # OpenAI and Kimi agents ignore `effort`.
  A02-SP:  { provider: openai,    model: openai_strong,  max_tokens: 32000,  temperature: 0.4 }
  A03-LM:  { provider: openai,    model: openai_strong,  max_tokens: 32000,  temperature: 0.2 }
  A04-CQ:  { provider: anthropic, model: claude_fast,    max_tokens: 32000,  temperature: 0.0 }
  A05-KE:  { provider: anthropic, model: claude_default, max_tokens: 64000,  effort: medium, temperature: 0.0,
             cache_system: true }   # system prompt (~10.6k tokens) is identical for every paper
             # cache_payload: [review_spec, record] caches the paper for a re-extraction. Off: extraction
             # and re-extraction are separate stages, often an hour apart, beyond the 5-minute cache,
             # so every paper would pay the 25% write premium without a read.
  A06-SV:  { provider: openai,    model: openai_strong,  max_tokens: 32000,  temperature: 0.0 }  # audits A05 (Claude)
  A07-SYN: { provider: anthropic, model: claude_opus5,   max_tokens: 128000, effort: high,   temperature: 0.3 }
  A08-OL:  { provider: openai,    model: openai_strong,  max_tokens: 32000,  temperature: 0.2 }
  A09-WRI: { provider: anthropic, model: claude_opus5,   max_tokens: 64000,  effort: high,   temperature: 0.5 }
  A10-RV:  { provider: openai,    model: openai_strong,  max_tokens: 32000,  temperature: 0.0 }  # audits A09/A12 (Claude)
  A11-RC:  { provider: kimi,      model: kimi_pro,       max_tokens: 32000,  temperature: 0.3 }  # third vendor
  A12-EDI: { provider: anthropic, model: claude_default, max_tokens: 64000,  effort: medium, temperature: 0.2 }

# Theme framework: A02 proposes primary themes (approved at CP1). The range is guidance: A02 justifies
# its number against how heterogeneous the evidence is. Subthemes are free; only you change primary themes.
themes:
  primary_min: 5
  primary_max: 8

# Passed to A08-OL as the researcher's preference for the review's display item(s).
outline:
  display_preference: >-
    One display item: an evidence map across study systems (FIGURE_EVIDENCE_MAP), showing where
    evidence exists and where it stops, which states the preclinical-to-clinical translation gap visually.

# A06 instability test: after per-paper validation, every paper with a blocked finding is validated once
# more with the identical input (whole paper against whole paper, same prompt, text, identities and model
# settings). Agreement goes to data/instability_test.json; a finding whose two readings give it different
# roles is quarantined for human review. Priced in the CP2 projection.
validation:
  instability_test: true

# A10: conservative serialized-byte admission stays below the 272k pricing threshold.
scientific_verification:
  context_ceiling_tokens: 240000
  max_occurrences_per_packet: 12
  max_global_entries_per_page: 128
  output_limits: { LOCAL: 10000, GLOBAL: 8000 }
  retrieval_limit: 12
  max_retrieval_rounds: 2

# A07-SYN runs as one logical synthesis job; packet boundaries are not manuscript sections.
# Registry-backed PLAN, bounded GROUP/retrieval, global RECONCILE, compact FINAL.
synthesis:
  theme_merge_max: 40            # legacy helper only; registry synthesis never merges approved themes
  max_tokens_per_turn: 12000     # compatibility default; mode limits below include thinking
  max_findings_per_group: 24     # deterministic packets within approved primary themes
  max_items_per_group: 8
  max_items_per_source_group: 16 # source-only analysis; no findings removed, same 12k output cap
  max_propositions_per_group: 12
  reconcile_page_size: 32
  max_retrieval_rounds: 2
  retrieval_limit: 12
  output_limits: { PLAN: 4000, GROUP: 12000, RECONCILE: 6000, FINAL: 6000 }
  context_ceiling_tokens: 900000 # stop cleanly if projected input + max output would exceed this (window 1M)
  cache_ttl: 1h                  # cache the small shared system prompt, not the raw corpus

# Vendor batch APIs (50% off) for stages of independent calls: A05 and A06 per paper (A06 only while
# loops.max_reextractions is 0). Before a batch: one real item runs interactively (a refusal stops the stage
# for one paper's cost), and the batch's worst-case cost (every item at max_tokens) is reserved under the
# cap, or the batch is NOT submitted. A06 routes per paper away from the vendor of that paper's extraction.
# `litreview run` reattaches to a running batch, adopting one only when its identity is proven. The vendors
# allow 24 hours; throughput at full scale is unmeasured (records/batch_tests.jsonl: compatibility only).
batch:
  enabled: true
  gate_usd: 150.00             # runtime gate before ANY batch: spent + committed (unsettled batches) + projected
                               #   (rest of the run) + this batch's worst case must not exceed it, or the stage
                               #   stops. Separate from run.spend_cap_usd, which stays absolute.
  agents: [A05-KE, A06-SV]
  min_items: 3                 # fewer items left after the probe: run them interactively
  chunk_size: 20               # items per batch; each chunk reserves its worst case (A05: 20 x 64k output
                               #   at $5/M + input, about $7) and releases it when it settles
  max_chunks_in_flight: 1      # chunks outstanding at once. Above 1 the cap stays strict (each chunk holds its
                               #   own reservation) but the back-pressure goes: one chunk's actual cost no
                               #   longer frees room before the next is reserved. Keep 1 until chunk
                               #   turnaround is measured on a real run; raise it then for throughput.
  poll_seconds: 60
  max_wait_hours: 24.5         # past this the run pauses; rerunning reattaches (results kept 29-30 days)
  cache_ttl: 1h                # Anthropic: batch items run concurrently, often beyond 5 minutes

# Refusal routing. Every agent call is recorded in records/model_record.jsonl (tracked in git, shared by
# all runs and machines) as COMPLETED or REFUSED, with model, agent and the run's topic family
# (`litreview new --family`). A model that has refused in a topic family is not used again for that
# family: the agent moves to its next alternate, or the stage fails before any call if none is left.
# A refusal is never retried. Every agent has an alternate; each keeps the vendor rule above (an
# auditor's alternate is still a different vendor from the agent it checks).
routing:
  # Routing to an alternate that would cost more than this multiple of the primary (priced from the
  # run's own calls) stops the run before any call and asks: `litreview approve-alternate RUN AGENT`.
  # A05 and A12 on Opus 5 (about 2.5x, more with cache reads) always ask.
  max_cost_multiple: 1.5
  alternates:
    A02-SP:  [{ provider: kimi,      model: kimi_pro }]          # same price; planners have no vendor constraint
    A03-LM:  [{ provider: kimi,      model: kimi_pro }]
    # Haiku shares the 5.5 safety-classifier family that refused this topic at Opus 5.5; screening
    # processes hundreds of records, so A04 has a non-Anthropic alternate at the same price.
    A04-CQ:  [{ provider: openai,    model: openai_luna }]
    A05-KE:  [{ provider: anthropic, model: claude_opus5 }]      # audited by OpenAI (A06): stays off OpenAI; 2.5x price
    A06-SV:  [{ provider: kimi,      model: kimi_pro }]          # audits Claude: stays off Anthropic
    # Synthesis and writing: Sonnet 5.5 completed every A05 call on this topic family (1M input, 128k output).
    A07-SYN: [{ provider: anthropic, model: claude_default }]
    A08-OL:  [{ provider: kimi,      model: kimi_pro }]
    A09-WRI: [{ provider: anthropic, model: claude_default }]
    A10-RV:  [{ provider: kimi,      model: kimi_pro }]          # audits Claude: stays off Anthropic
    A11-RC:  [{ provider: openai,    model: openai_strong }]     # critiques Claude: stays off Anthropic
    A12-EDI: [{ provider: anthropic, model: claude_opus5 }]      # audited by OpenAI (A10): stays off OpenAI; 2.5x price

checkpoints:
  CP1: { after: A02-SP,  purpose: "Approve scope, perspective and selection criteria" }
  CP2: { after: A04-CQ,  purpose: "Select papers (every record shown, all tiers)" }
  CP3: { after: A07-SYN, purpose: "Approve thesis, adopt or reject interpretations" }

notify:
  on: [checkpoint, complete, budget_warning, failure, a10_detail]   # a10_detail: after a run's first A10 pass
  email_to_env: NOTIFY_EMAIL_TO   # address read from .env

tracing:
  # LangSmith tracing is switched on by LANGSMITH_TRACING=true in .env.
  # Traces include prompts and paper text: keep the LangSmith project private.
  project_env: LANGSMITH_PROJECT
